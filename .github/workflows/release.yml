name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: ./bun install

      # web-assets.generated.ts is produced by `build:web` and is gitignored.
      # Lint/typecheck/tests transitively import it through packages/cli/serve/.
      # Running the bundler alone (no Vite) emits an empty-map stub, which
      # satisfies the type shape without a full UI build.
      - name: Prepare embedded web assets (stub)
        run: ./bun scripts/bundle-web-assets.ts

      - name: Typecheck
        run: ./bun run typecheck

      - name: Lint
        run: ./bun run lint

      - name: Test (unit)
        run: ./bun run test:unit

      - name: Build @memory.build/protocol
        run: ./bun run --filter '@memory.build/protocol' build

      - name: Build @memory.build/client
        run: ./bun run --filter '@memory.build/client' build

      # OIDC trusted publishing requires npm >= 11.5.1 and generates provenance,
      # whose libnpmpublish/provenance.js does `require('sigstore')`. npm 12.0.0
      # regressed: it no longer hoists the unscoped `sigstore` module to npm's
      # top-level node_modules (it's buried under pacote), so publish dies with
      # "Cannot find module 'sigstore'". Pin the 11.x line, which bundles a
      # top-level sigstore and satisfies the >=11.5.1 OIDC requirement.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install npm 11.x (OIDC trusted publishing; 12.0.0 breaks provenance)
        run: npm install -g 'npm@^11.5.1'

      # Pack with bun, publish the tarball with npm.
      #
      # `npm publish` from inside a package dir does NOT rewrite
      # `workspace:*` dependency specs — that substitution only happens for
      # npm-managed workspaces, and this repo installs with bun. So publishing
      # directly shipped a literal `"@memory.build/protocol": "workspace:*"`
      # in @memory.build/client's manifest, and every consumer install died
      # with `Workspace dependency "@memory.build/protocol" not found`.
      #
      # `bun pm pack` resolves workspace protocols to the concrete version
      # (`"@memory.build/protocol": "<this release's version>"`), so pack with
      # bun and hand npm the finished tarball. npm still owns the upload, so
      # OIDC trusted publishing and provenance work exactly as before.
      #
      # Note the packages' `prepublishOnly` build hooks do not fire when
      # publishing a pre-made tarball — the explicit build steps above are
      # what produce `dist/`.
      - name: Pack npm tarballs (resolves workspace:* specs)
        run: |
          mkdir -p npm-tarballs
          ./bun pm pack --cwd packages/protocol --destination "$PWD/npm-tarballs"
          ./bun pm pack --cwd packages/client --destination "$PWD/npm-tarballs"

      # Fail loudly rather than shipping another broken manifest.
      - name: Verify no unresolved workspace specs survived packing
        run: ./bun scripts/npm/verify-tarballs.ts ./npm-tarballs

      # The `./` prefix is required: npm reads a bare relative path as a GitHub
      # `org/repo` shorthand and tries to `git ls-remote` it.
      - name: Publish @memory.build/protocol
        run: npm publish --access public "./npm-tarballs/memory.build-protocol-${GITHUB_REF_NAME#v}.tgz"

      - name: Publish @memory.build/client
        run: npm publish --access public "./npm-tarballs/memory.build-client-${GITHUB_REF_NAME#v}.tgz"

  build-cli:
    # Build on macOS so the darwin binary can be ad-hoc signed.
    # Unsigned Bun-compiled darwin binaries are killed by macOS at launch.
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: ./bun install

      - name: Build CLI (all platforms)
        run: ./bun run build:all

      - name: Generate checksums
        run: |
          cd dist
          for file in me-*; do
            shasum -a 256 "$file" > "${file}.sha256"
          done

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: me-binaries
          path: dist/me-*

  release-cli:
    runs-on: ubuntu-latest
    needs: [build-cli, publish-npm]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          name: me-binaries
          path: ./dist

      - name: List artifacts
        run: ls -la ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ./dist/*
          generate_release_notes: true

  publish-cli-npm:
    runs-on: ubuntu-latest
    needs: [build-cli, publish-npm]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          name: me-binaries
          path: ./dist

      - name: List artifacts
        run: ls -la ./dist

      # publish.ts shells out to a real npm (see its NPM_CMD). Pin npm 11.x:
      # 12.0.0 fails provenance with "Cannot find module 'sigstore'" (it no
      # longer hoists the module to npm's top-level node_modules).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install npm 11.x (OIDC trusted publishing; 12.0.0 breaks provenance)
        run: npm install -g 'npm@^11.5.1'

      - name: Publish to npm
        run: |
          ./bun run scripts/npm/publish.ts \
            --version "${GITHUB_REF_NAME#v}" \
            --binaries-dir ./dist

  publish-homebrew:
    runs-on: ubuntu-latest
    needs:
      - build-cli
      - release-cli
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          name: me-binaries
          path: ./dist

      - name: List artifacts
        run: ls -la ./dist

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          ./bun run scripts/brew/update-formula.ts \
            --version "${GITHUB_REF_NAME#v}" \
            --binaries-dir ./dist
