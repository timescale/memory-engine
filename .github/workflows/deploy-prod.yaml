name: Deploy Prod - Tagged Release
on:
  push:
    tags:
      - "server/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. server/v1.2.3)"
        required: true
        type: string

# The jobs only read the repo and dispatch to tiger-agents-deploy with a PAT;
# nothing needs the workflow token to write.
permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve tag to commit SHA
        id: resolve
        # Inputs reach the shell through env, never by template expansion into
        # the script, so a crafted tag can't inject commands.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA=$(git rev-list -1 "$INPUT_TAG" 2>/dev/null) || { echo "::error::Tag '$INPUT_TAG' not found"; exit 1; }
            echo "Resolved tag '$INPUT_TAG' to SHA: $SHA"
          else
            SHA="$EVENT_SHA"
            echo "Using event SHA: $SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - name: Dispatch Build
        uses: timescale/workflow-dispatch-action@main
        with:
          github-token: ${{ secrets.ORG_AUTOMATION_TOKEN }}
          owner: timescale
          repo: tiger-agents-deploy
          workflow_id: build.yaml
          ref: "main"
          inputs: >
            {
              "repository": "memory-engine",
              "dockerfile_path": "packages/server/Dockerfile",
              "sha": "${{ needs.resolve.outputs.sha }}",
              "latest": true
            }

  deploy:
    runs-on: ubuntu-latest
    needs: [resolve, build]
    steps:
      - name: Dispatch Deploy - prod
        uses: timescale/workflow-dispatch-action@main
        with:
          github-token: ${{ secrets.ORG_AUTOMATION_TOKEN }}
          owner: timescale
          repo: tiger-agents-deploy
          workflow_id: deploy.yaml
          ref: "main"
          inputs: >
            {
              "repository": "memory-engine",
              "sha": "${{ needs.resolve.outputs.sha }}",
              "env": "prod",
              "namespace": "memory-engine"
            }
