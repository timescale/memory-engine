name: Deploy Dev - Merge main
on:
  push:
    branches:
      - main
    paths:
      - packages/server/**
      - packages/engine/**
      - packages/embedding/**
      - packages/worker/**
      - packages/protocol/**
      - packages/auth/**
      - packages/database/**
      # The web UI is bundled into the server image (bundle-web-assets), so a
      # UI-only change still needs a dev redeploy to ship.
      - packages/web/**
      - scripts/**
      - package.json
      - bun.lock
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "main"
        type: string

# The jobs only read the repo and dispatch to tiger-agents-deploy with a PAT;
# nothing needs the workflow token to write.
permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve ref to commit SHA
        id: resolve
        # Inputs reach the shell through env, never by template expansion into
        # the script, so a crafted ref can't inject commands.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHA=$(git rev-parse --verify "${INPUT_REF}^{commit}" 2>/dev/null) || { echo "::error::Ref '$INPUT_REF' not found"; exit 1; }
            echo "Resolved ref '$INPUT_REF' to SHA: $SHA"
          else
            SHA="$EVENT_SHA"
            echo "Using event SHA: $SHA"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: resolve
    steps:
      - name: Dispatch Build
        uses: timescale/workflow-dispatch-action@main
        with:
          github-token: ${{ secrets.ORG_AUTOMATION_TOKEN }}
          owner: timescale
          repo: tiger-agents-deploy
          workflow_id: build.yaml
          ref: "main"
          inputs: >
            {
              "repository": "memory-engine",
              "dockerfile_path": "packages/server/Dockerfile",
              "sha": "${{ needs.resolve.outputs.sha }}",
              "latest": true,
              "env_prefix": "dev"
            }

  deploy:
    runs-on: ubuntu-latest
    needs: [resolve, build]
    steps:
      - name: Dispatch Deploy - dev
        uses: timescale/workflow-dispatch-action@main
        with:
          github-token: ${{ secrets.ORG_AUTOMATION_TOKEN }}
          owner: timescale
          repo: tiger-agents-deploy
          workflow_id: deploy.yaml
          ref: "main"
          inputs: >
            {
              "repository": "memory-engine",
              "sha": "${{ needs.resolve.outputs.sha }}",
              "env": "dev",
              "namespace": "savannah-system"
            }
