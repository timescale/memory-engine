name: Validate Packs

on:
  push:
    branches: [main]
    paths:
      - "packs/**"
      - "scripts/validate-packs.ts"
      - "scripts/pack-uuids.ts"
      - "scripts/package.json"
      - "packages/cli/parsers/pack.ts"
      - "packages/cli/parsers/validation.ts"
      - "packages/cli/parsers/index.ts"
      - ".github/workflows/validate-packs.yml"
  pull_request:
    paths:
      - "packs/**"
      - "scripts/validate-packs.ts"
      - "scripts/pack-uuids.ts"
      - "scripts/package.json"
      - "packages/cli/parsers/pack.ts"
      - "packages/cli/parsers/validation.ts"
      - "packages/cli/parsers/index.ts"
      - ".github/workflows/validate-packs.yml"

permissions:
  contents: read

jobs:
  validate:
    # PRs from forks stay on GitHub-hosted runners so outside code never runs in the CI account.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'runs-on/fleet=linux-2cpu-x64/env=ue1' }}
    steps:
      - uses: runs-on/action@284bff869d4a825f778ac7c38e50f1e31ef198fd # v2.6.0
        if: ${{ !github.event.pull_request.head.repo.fork }}
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: ./bun install
      - name: Validate packs
        run: ./bun run scripts/validate-packs.ts
